{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CFA Registration - College and Fest Information</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@400;500;600;700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'cfa/style_base.css' %}?v=cfa_figma_v1" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QX9VT4R4Z7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-QX9VT4R4Z7');
    </script>
</head>
<body>
    <!-- Navbar -->
    <header class="navbar-wrapper">
      <nav class="nav-bar">
        <div class="nav-brand">
          <a href="{% url 'prelimspage' %}" class="brand-link">
            <img src="{% static 'core/landing/logo.png' %}" class="brand-logo" alt="Logo" />
            <div class="brand-text">
              <span class="brand-alcheringa">ALCHERINGA</span>
              <span class="brand-year">2027</span>
            </div>
          </a>
        </div>
        <div class="nav-links">
          <a href="{% url 'competitions' %}">Competitions</a>
          <a href="{% url 'prelimspage' %}#faq">FAQs</a>
          <a href="{% url 'prelimspage' %}#contact">Contact</a>
        </div>
        <div class="nav-action">
          <a href="{% url 'cfa_step1' %}" class="nav-register-btn">Register</a>
        </div>
      </nav>
    </header>

    <!-- Stepper / Progress Bar -->
    <div class="steps-container">
      <div class="step-track-line line-1 completed"></div>
      <div class="step-track-line line-2"></div>

      <!-- Step 1: Completed -->
      <div class="step-item step-1 completed">
        <div class="step-box">
          <span class="step-num">1</span>
          <svg class="check-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="step-title">Basic Information</span>
      </div>

      <!-- Step 2: Active -->
      <div class="step-item step-2 active">
        <div class="step-box">
          <span class="step-num">2</span>
          <svg class="check-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="step-title">College and Fest information</span>
      </div>

      <!-- Step 3: Upcoming -->
      <div class="step-item step-3">
        <div class="step-box">
          <span class="step-num">3</span>
          <svg class="check-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="step-title">Fest Operations</span>
      </div>
    </div>

    <!-- Form Container -->
    <div class="form-container">
      <a href="{% url 'cfa_step1' %}" class="back-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="8" x2="4" y2="8"></line>
          <polyline points="8 4 4 8 8 12"></polyline>
        </svg>
        <span>Back</span>
      </a>

      <h2 class="form-title">College and Fest information</h2>

      <form method="POST" action="">
        {% csrf_token %}
        <div class="form-grid">
          <!-- Row 1 -->
          <div class="form-group">
            <label for="college_name">Full Name</label>
            <input type="text" id="college_name" name="college_name" placeholder="Enter your full name" required />
          </div>

          <div class="form-group">
            <label for="college_designation">Your college designation</label>
            <input type="text" id="college_designation" name="college_designation" placeholder="Enter your college designation" required />
          </div>

          <!-- Row 2 -->
          <div class="form-group">
            <label for="fest_name">College fest name</label>
            <input type="text" id="fest_name" name="fest_name" placeholder="Enter your college fest name" required />
          </div>

          <div class="form-group">
            <label for="fest_address">College fest address</label>
            <input type="text" id="fest_address" name="fest_address" placeholder="Enter your fest address" required />
          </div>

          <!-- Row 3 -->
          <div class="form-group">
            <label for="fest_dates">College fest dates(tentative)</label>
            <input type="text" id="fest_dates" name="fest_dates" placeholder="Enter your college fest dates" required />
          </div>

          <div class="form-group">
            <label for="number_of_days">Number of days in fest</label>
            <input type="text" id="number_of_days" name="number_of_days" placeholder="Enter number of days in fest" required />
          </div>

          <!-- Row 4 -->
          <div class="form-group">
            <label for="expected_footfall">Expected footfall</label>
            <input type="text" id="expected_footfall" name="expected_footfall" placeholder="Enter your expected footfall" required />
          </div>

          <div class="form-group">
            <label for="social_links">Website/ Social media link</label>
            <input type="text" id="social_links" name="social_links" placeholder="Enter link" />
          </div>
        </div>

        <div class="form-footer">
          <button type="submit" class="next-btn">
            <span>Next</span>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="2" y1="6" x2="10" y2="6"></line>
              <polyline points="6 2 10 6 6 10"></polyline>
            </svg>
          </button>
        </div>
      </form>
    </div>
</body>
</html>
