{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CFA Registration - Fest Operations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@400;500;600;700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'cfa/style_base.css' %}?v=cfa_figma_v1" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QX9VT4R4Z7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-QX9VT4R4Z7');
    </script>
</head>
<body>
    <!-- Navbar -->
    <header class="navbar-wrapper">
      <nav class="nav-bar">
        <div class="nav-brand">
          <a href="{% url 'prelimspage' %}" class="brand-link">
            <img src="{% static 'core/landing/logo.png' %}" class="brand-logo" alt="Logo" />
            <div class="brand-text">
              <span class="brand-alcheringa">ALCHERINGA</span>
              <span class="brand-year">2027</span>
            </div>
          </a>
        </div>
        <div class="nav-links">
          <a href="{% url 'competitions' %}">Competitions</a>
          <a href="{% url 'prelimspage' %}#faq">FAQs</a>
          <a href="{% url 'prelimspage' %}#contact">Contact</a>
        </div>
        <div class="nav-action">
          <a href="{% url 'cfa_step1' %}" class="nav-register-btn">Register</a>
        </div>
      </nav>
    </header>

    <!-- Stepper / Progress Bar -->
    <div class="steps-container">
      <div class="step-track-line line-1 completed"></div>
      <div class="step-track-line line-2 completed"></div>

      <!-- Step 1: Completed -->
      <div class="step-item step-1 completed">
        <div class="step-box">
          <span class="step-num">1</span>
          <svg class="check-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="step-title">Basic Information</span>
      </div>

      <!-- Step 2: Completed -->
      <div class="step-item step-2 completed">
        <div class="step-box">
          <span class="step-num">2</span>
          <svg class="check-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="step-title">College and Fest information</span>
      </div>

      <!-- Step 3: Active -->
      <div class="step-item step-3 active">
        <div class="step-box">
          <span class="step-num">3</span>
          <svg class="check-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="step-title">Fest Operations</span>
      </div>
    </div>

    <!-- Form Container -->
    <div class="form-container">
      <a href="{% url 'cfa_step2' %}" class="back-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="8" x2="4" y2="8"></line>
          <polyline points="8 4 4 8 8 12"></polyline>
        </svg>
        <span>Back</span>
      </a>

      <h2 class="form-title">Fest Operations</h2>

      <form method="POST" action="">
        {% csrf_token %}
        
        <div class="form-group" style="margin-bottom: 24px;">
          <label>Does your college fest conduct competitions?</label>
          <div class="radio-options-row">
            <label class="radio-btn-label">
              <input type="radio" name="competitions" value="yes" checked />
              <div class="radio-pill">Yes</div>
            </label>
            <label class="radio-btn-label">
              <input type="radio" name="competitions" value="no" />
              <div class="radio-pill">No</div>
            </label>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="team_size">Organizing Team Size</label>
            <input type="text" id="team_size" name="team_size" placeholder="88" />
          </div>

          <div class="form-group">
            <label for="fest_address">College Fest Address</label>
            <input type="text" id="fest_address" name="fest_address" placeholder="Enter your phone number" />
          </div>

          <div class="form-group full-width">
            <label for="expectations">Your expectations from this college</label>
            <input type="text" id="expectations" name="expectations" placeholder="Type here" />
          </div>
        </div>

        <div class="form-footer">
          <button type="submit" class="submit-btn">
            <span>Submit</span>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="2" y1="6" x2="10" y2="6"></line>
              <polyline points="6 2 10 6 6 10"></polyline>
            </svg>
          </button>
        </div>
      </form>
    </div>
</body>
</html>
